name: MSBuild

on:
  push:
    branches: "main"
    paths-ignore:
      - '*.md'
      - '.github/*.md'
      - LICENSE
  pull_request:
    branches: "main"
    paths-ignore:
      - '*.md'
      - '.github/*.md'
      - LICENSE

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false

      matrix:
        platform: [x64, ARM64]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: 'Build (Debug)'
        run: >
          msbuild /p:Configuration=Debug /p:Platform=${{ matrix.platform }}
          DirectXTKStarterKit.sln

      - name: 'Build (Release)'
        run: >
          msbuild /p:Configuration=Release /p:Platform=${{ matrix.platform }}
          DirectXTKStarterKit.sln
